    <!-- Desktop Navigation -->
    <div class="elm-nav" role="menubar">
      @for (item of navItems(); track item.label) {
        <div class="elm-nav-item" role="none">
          <a
            [routerLink]="item.route"
            routerLinkActive="elm-active"
            class="elm-nav-link"
            role="menuitem"
            [attr.aria-haspopup]="item.hasDropdown ? 'true' : null"
          >
            {{ item.label }}
            @if (item.hasDropdown) {
              <i class="pi pi-chevron-down nav-arrow" aria-hidden="true"></i>
            }
          </a>
        </div>
      }
    </div>

        <span class="action-label">البحث</span>
      </button>

      <a routerLink="/home" class="login-btn" aria-label="تسجيل الدخول">
        <i class="pi pi-user" aria-hidden="true"></i>
        <span>تسجيل الدخول</span>
      </a>
    </div>

    <!-- Mobile Menu Toggle -->
    <button
      class="mobile-toggle"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="isMobileMenuOpen()"
      aria-controls="mobile-menu"
      aria-label="فتح القائمة"
      type="button"
    >
      <span class="hamburger" [class.open]="isMobileMenuOpen()">
        <span></span>
        <span></span>
        <span></span>
      </span>
    </button>
  </div>

  <!-- Mobile Menu -->
  @if (isMobileMenuOpen()) {
    <div class="mobile-menu" id="mobile-menu" role="navigation" aria-label="القائمة الجانبية">
      <ul class="mobile-nav" role="menu">
        @for (item of navItems(); track item.label) {
          <li role="none">
            <a
              [routerLink]="item.route"
              routerLinkActive="active"
              class="mobile-link"
              role="menuitem"
              (click)="closeMobileMenu()"
            >
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
      <div class="mobile-actions">
        <button class="action-btn" type="button">
          <i class="pi pi-search" aria-hidden="true"></i>
          <span>البحث</span>
        </button>
        <button class="action-btn" type="button">
          <i class="pi pi-globe" aria-hidden="true"></i>
          <span>English</span>
        </button>
        <a routerLink="/home" class="login-btn" (click)="closeMobileMenu()">
          <i class="pi pi-user" aria-hidden="true"></i>
          <span>تسجيل الدخول</span>
        </a>
      </div>
    </div>
  }
</header>
